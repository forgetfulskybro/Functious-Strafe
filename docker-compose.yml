version: '3.8'

services:
  functious:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - TOKEN=${TOKEN}
      - MONGODB=${MONGODB}
      - SECRET=${SECRET}
      - BOTID=${BOTID}
    ports:
      - "8889:8889"
    restart: unless-stopped
